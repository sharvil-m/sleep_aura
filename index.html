<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SleepAura 🌙</title>
  <style>
    body { font-family: sans-serif; background:#0f172a; color:white; }
    .features { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; padding:2rem; }
    .feature { background:#1e293b; padding:1rem; border-radius:1rem; cursor:pointer; position:relative; }
    .feature.playing { border:2px solid gold; }
    .timer-select { display:none; margin-top:1rem; }
    .timer-select.show { display:block; }
  </style>
</head>
<body>
  <header>
    <h1>SleepAura 🌙</h1>
    <p>Tune your mood. Transform your sleep.</p>
  </header>

  <section class="features">
    <div class="feature" data-sound="sounds/528hz.mp3">
      <span>😠</span>
      <h3>Calm Anger</h3>
      <p>528Hz tones dissolve tension.</p>
      <div class="timer-select">
        <label>Select time:</label>
        <select>
          <option value="">Choose duration</option>
          <option value="300">5 min</option>
          <option value="600">10 min</option>
        </select>
      </div>
    </div>

    <div class="feature" data-sound="sounds/396hz.mp3">
      <span>😢</span>
      <h3>Ease Sadness</h3>
      <p>396Hz tones uplift mood.</p>
      <div class="timer-select">
        <label>Select time:</label>
        <select>
          <option value="">Choose duration</option>
          <option value="300">5 min</option>
          <option value="600">10 min</option>
        </select>
      </div>
    </div>
  </section>

<script>
  document.querySelectorAll(".feature").forEach(feature=>{
    const selectBox = feature.querySelector("select");
    const timerDiv = feature.querySelector(".timer-select");

    // Open dropdown when clicking the feature card
    feature.addEventListener("click", e=>{
      // If you clicked inside the timer-select, don't toggle
      if (e.target.closest(".timer-select")) return;

      // Close all other dropdowns
      document.querySelectorAll(".timer-select").forEach(div=>div.classList.remove("show"));
      document.querySelectorAll(".feature").forEach(f=>f.classList.remove("playing"));

      // Open this one
      timerDiv.classList.add("show");
      feature.classList.add("playing");
    });

    // Prevent closing when clicking inside dropdown
    timerDiv.addEventListener("click", e=>e.stopPropagation());

    // Handle selection
    selectBox.addEventListener("change", ()=>{
      if (!selectBox.value) return;
      alert("⏱ Playing sound: " + feature.dataset.sound + " for " + selectBox.value + "s");
      timerDiv.classList.remove("show");
    });
  });

  // Close dropdowns when clicking outside
  document.body.addEventListener("click", e=>{
    if (!e.target.closest(".feature")) {
      document.querySelectorAll(".timer-select").forEach(div=>div.classList.remove("show"));
      document.querySelectorAll(".feature").forEach(f=>f.classList.remove("playing"));
    }
  });
</script>
</body>
</html>
