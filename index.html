<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SleepAura 🌙 - Find Your Calm</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Outfit',sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);color:#f1f5f9;min-height:100dvh;display:flex;flex-direction:column}
    header{padding:20px;text-align:center}
    h1{font-weight:600}
    .container{width:min(920px,94%);margin:0 auto 28px auto}
    .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin:16px 0}
    button{background:#334155;color:#e2e8f0;border:0;padding:12px 16px;border-radius:14px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    button:hover{filter:brightness(1.08)}
    select{background:#0b1220;color:#e5e7eb;border:1px solid #263248;border-radius:12px;padding:10px}
    .row{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
    @media (max-width:760px){.row{grid-template-columns:1fr}}
    .card{background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.18);backdrop-filter:blur(10px);padding:16px;border-radius:18px}
    .footer{opacity:.75;text-align:center;padding:16px 0}
  </style>
</head>
<body>
  <header>
    <h1>SleepAura 🌙</h1>
    <p>Calming frequencies + ambient sounds for better sleep</p>
  </header>

  <main class="container">
    <div class="card">
      <div class="controls">
        <label>
          Frequency
          <select id="freqSelect">
            <option value="./sounds/frequencies/396hz.mp3">396 Hz</option>
            <option value="./sounds/frequencies/432hz.mp3">432 Hz</option>
            <option value="./sounds/frequencies/528hz.mp3" selected>528 Hz</option>
            <option value="./sounds/frequencies/639hz.mp3">639 Hz</option>
            <option value="./sounds/frequencies/741hz.mp3">741 Hz</option>
            <option value="./sounds/frequencies/852hz.mp3">852 Hz</option>
          </select>
        </label>
        <label>
          Ambient
          <select id="ambSelect">
            <option value="./sounds/ambient_sounds/rain.mp3" selected>Rain</option>
            <option value="./sounds/ambient_sounds/ocean.mp3">Ocean</option>
            <option value="./sounds/ambient_sounds/wind.mp3">Wind</option>
            <option value="./sounds/ambient_sounds/fire.mp3">Fire</option>
          </select>
        </label>
        <label>
          Duration
          <select id="duration">
            <option value="300000">5 min</option>
            <option value="600000" selected>10 min</option>
            <option value="900000">15 min</option>
            <option value="1800000">30 min</option>
            <option value="3600000">1 hour</option>
          </select>
        </label>
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
        <span id="timer" aria-live="polite"></span>
      </div>
    </div>
  </main>

  <div class="footer">Installable PWA • Works offline after first play • v7-ambient_sounds</div>

  <script>
  // --- SleepAura: service worker registration (single-run) ---
  if ('serviceWorker' in navigator) {
    if (!window.__sa_sw_registered) {
      window.__sa_sw_registered = true;
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').then(reg => {
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing; if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                location.reload();
              }
            });
          });
        });
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return; refreshing = true; location.reload();
        });
      });
    }
  }

  // --- SleepAura: shared audio controller (freq + ambient) ---
  window.SA = window.SA || {};
  if (!window.SA.audio) {
    const fadeTo = (el, target = 1, ms = 600) => {
      const steps = 20, step = (target - el.volume) / steps; let i = 0;
      const id = setInterval(() => { i++; el.volume = Math.max(0, Math.min(1, el.volume + step)); if (i >= steps) clearInterval(id); }, ms / steps);
    };

    window.SA.audio = {
      freq: new Audio(),
      amb:  new Audio(),
      play({ freqSrc, ambSrc, freqVol = 0.8, ambVol = 0.4, durationMs = 600000 }) {
        this.stop();
        this.freq.src = freqSrc; this.amb.src = ambSrc;
        this.freq.loop = true;   this.amb.loop = true;
        this.freq.volume = 0;    this.amb.volume = 0;
        Promise.allSettled([ this.freq.play(), this.amb.play() ]).then(() => {
          fadeTo(this.freq, freqVol, 600);
          fadeTo(this.amb,  ambVol,  600);
        });

        clearInterval(this._tock); clearTimeout(this._end);
        const start = Date.now();
        const tickEl = document.getElementById('timer');
        const fmt = ms => new Date(ms).toISOString().substr(14,5);
        this._tock = setInterval(() => {
          const left = Math.max(0, durationMs - (Date.now() - start));
          if (tickEl) tickEl.textContent = "⏱ " + fmt(left);
          if (left <= 0) { clearInterval(this._tock); }
        }, 250);
        this._end = setTimeout(() => {
          fadeTo(this.freq, 0, 20000); fadeTo(this.amb, 0, 20000);
          setTimeout(() => this.stop(), 20500);
        }, Math.max(0, durationMs - 20000));
      },
      stop() {
        clearInterval(this._tock); clearTimeout(this._end);
        [this.freq, this.amb].forEach(a => { a.pause(); a.currentTime = 0; a.volume = 0; });
        const tickEl = document.getElementById('timer'); if (tickEl) tickEl.textContent = '';
      }
    };

    const q = id => document.getElementById(id);
    q('startBtn')?.addEventListener('click', () => {
      window.SA.audio.play({
        freqSrc: q('freqSelect').value,
        ambSrc:  q('ambSelect').value,
        durationMs: Number(q('duration').value)
      });
    });
    q('stopBtn')?.addEventListener('click', () => window.SA.audio.stop());
  }
  </script>
</body>
</html>
