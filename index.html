<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#10b981">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SleepAura 🌙 - Find Your Calm</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* --- (your full CSS kept same, unchanged) --- */
  </style>
</head>
<body>

  <header>
    <h1>SleepAura 🌙</h1>
    <p>Tune your mood. Transform your sleep.</p>
  </header>

  <section class="features">
    <!-- features (same as your code, unchanged) -->
    <!-- ... -->
  </section>

  <div class="controls">
    <div class="timer-display" id="timerDisplay">
      ⏱️ <span id="timeRemaining">--:--</span>
    </div>
    
    <div class="volume-container" id="volumeContainer">
      <span>🔊</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.7">
      <span id="volumePercent">70%</span>
    </div>
    
    <button id="stopButton">⏹ Stop Sound</button>
  </div>

  <div class="fade-indicator" id="fadeIndicator">
    🌅 Sound is gently fading...
  </div>

  <footer>
    SleepAura © 2025 | Created to help you find peace before sleep
  </footer>

<script>
  let currentAudio = null;
  let stopTimeout = null;
  let fadeTimeout = null;
  let timerInterval = null;
  let endTime = null;
  let currentFeature = null;

  const volumeSlider = document.getElementById('volumeSlider');
  const volumePercent = document.getElementById('volumePercent');
  
  volumeSlider.addEventListener('input', (e) => {
    const volume = parseFloat(e.target.value);
    volumePercent.textContent = Math.round(volume * 100) + '%';
    if (currentAudio) currentAudio.volume = volume;
  });

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  }

  function updateTimer() {
    if (!endTime) return;
    const now = Date.now();
    const remaining = Math.max(0, Math.ceil((endTime - now) / 1000));
    document.getElementById('timeRemaining').textContent = formatTime(remaining);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      document.getElementById('timerDisplay').classList.remove('show');
    }
  }

  function fadeOutAudio(audio, duration = 60000) {
    const startVolume = audio.volume;
    const fadeStep = startVolume / (duration / 100);
    document.getElementById('fadeIndicator').classList.add('show');
    const fadeInterval = setInterval(() => {
      if (audio.volume > fadeStep) {
        audio.volume = Math.max(0, audio.volume - fadeStep);
      } else {
        audio.volume = 0;
        clearInterval(fadeInterval);
        document.getElementById('fadeIndicator').classList.remove('show');
      }
    }, 100);
    return fadeInterval;
  }

  document.querySelectorAll(".feature").forEach(feature => {
    const selectBox = feature.querySelector("select");
    const timerDiv = feature.querySelector(".timer-select");
    const soundFile = feature.getAttribute("data-sound");

    // open dropdown on feature click
    feature.addEventListener("click", (e) => {
      if (e.target.closest("select")) return; // let select work normally
      // Hide all others
      document.querySelectorAll(".timer-select").forEach(div => div.style.display = "none");
      document.querySelectorAll(".feature").forEach(f => f.classList.remove('playing'));
      // Show this one
      timerDiv.style.display = "block";
    });

    // prevent feature click when using select
    selectBox.addEventListener("click", (e) => {
      e.stopPropagation();
    });

    selectBox.addEventListener("change", () => {
      const duration = parseInt(selectBox.value) * 1000;
      if (!selectBox.value) return;

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        clearTimeout(stopTimeout);
        clearTimeout(fadeTimeout);
        clearInterval(timerInterval);
      }

      document.querySelectorAll(".feature").forEach(f => f.classList.remove('playing'));
      feature.classList.add('playing');
      currentFeature = feature;

      currentAudio = new Audio(soundFile);
      currentAudio.loop = true;
      currentAudio.volume = parseFloat(volumeSlider.value);
      currentAudio.play().catch(err => {
        console.error("⚠️ Audio play failed:", err);
        alert("Unable to play audio. Please check if the sound file exists.");
      });

      endTime = Date.now() + duration;
      timerInterval = setInterval(updateTimer, 1000);
      updateTimer();

      document.getElementById("stopButton").style.display = "block";
      document.getElementById("volumeContainer").classList.add("show");
      document.getElementById("timerDisplay").classList.add("show");

      if (duration > 60000) {
        fadeTimeout = setTimeout(() => {
          if (currentAudio) fadeOutAudio(currentAudio);
        }, duration - 60000);
      }

      stopTimeout = setTimeout(stopAudio, duration);
      timerDiv.style.display = "none";
    });
  });

  function stopAudio() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
    clearTimeout(stopTimeout);
    clearTimeout(fadeTimeout);
    clearInterval(timerInterval);
    document.getElementById("stopButton").style.display = "none";
    document.getElementById("volumeContainer").classList.remove("show");
    document.getElementById("timerDisplay").classList.remove("show");
    document.getElementById("fadeIndicator").classList.remove("show");
    if (currentFeature) {
      currentFeature.classList.remove('playing');
      currentFeature = null;
    }
    endTime = null;
  }

  document.getElementById("stopButton").addEventListener("click", stopAudio);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('✅ Service Worker registered'))
      .catch(err => console.error('❌ Service Worker failed:', err));
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && currentAudio) {
      currentAudio.pause();
    } else if (!document.hidden && currentAudio && endTime && Date.now() < endTime) {
      currentAudio.play().catch(err => console.error("Resume failed:", err));
    }
  });
</script>
</body>
</html>
