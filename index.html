           Base Styles + Reset
           =========================== */
        :root {
            --bg: #0b0b14;
            --card: #121225;
            --accent: #7c3aed; /* Purple accent */
            --accent-2: #a78bfa;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --glow: 0 0 60px rgba(124, 58, 237, 0.35);
            --shadow: 0 8px 32px rgba(0,0,0,0.35);
            --glass: rgba(255,255,255,0.06);
            --glass-border: rgba(255,255,255,0.1);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: radial-gradient(1200px 800px at 80% -10%, rgba(124, 58, 237, 0.16), transparent 70%),
                        radial-gradient(1200px 800px at 10% 110%, rgba(99, 102, 241, 0.18), transparent 75%),
                        linear-gradient(180deg, #0a0a13, #0b0b14 55%, #0b0b14);
            color: var(--text);
            font-family: 'Outfit', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ===========================
           Header / Hero
           =========================== */
        .wrap {
            max-width: 1120px;
            margin: 0 auto;
            padding: 24px;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: saturate(1.2) blur(6px);
            background: linear-gradient(180deg, rgba(10, 10, 19, 0.8), rgba(10, 10, 19, 0.55) 60%, rgba(10, 10, 19, 0));
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .brand {
            display: flex; align-items: center; gap: 12px;
            font-weight: 700; letter-spacing: .2px;
        }
        .brand-badge {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: grid; place-items: center;
            background: linear-gradient(145deg, rgba(124, 58, 237, 0.85), rgba(99, 102, 241, 0.85));
            box-shadow: var(--glow);
        }
        .brand-badge span { font-size: 18px; }

        .hero {
            padding: 64px 0 24px;
            display: grid; gap: 28px;
        }
        .hero h1 {
            font-size: clamp(32px, 4.5vw, 56px);
            line-height: 1.05;
            margin: 0;
            background: linear-gradient(180deg, #fff, #d1c9ff 60%);
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            text-shadow: 0 0 0 rgba(0,0,0,0);
        }
        .hero p {
            color: var(--muted);
            font-size: clamp(16px, 2.6vw, 18.5px);
            margin: 6px 0 0;
        }

        /* CTA row */
        .cta-row {
            display: flex; gap: 12px; flex-wrap: wrap;
            margin-top: 16px;
        }
        .btn {
            appearance: none; border: 1px solid transparent;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 600; letter-spacing: .2px;
            color: white; cursor: pointer;
            transition: all .2s ease;
            box-shadow: 0 8px 25px rgba(124,58,237,.22);
            background: linear-gradient(160deg, #7c3aed, #6d28d9);
        }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }

            border-color: rgba(255,255,255,.12);
            box-shadow: var(--shadow);
        }
